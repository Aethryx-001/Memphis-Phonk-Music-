name: Generate Memphis Phonk

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate music
        run: python main.py

      - name: Upload music
        uses: actions/upload-artifact@v4
        with:
          name: memphis-phonk-audio
          path: output.wav
